<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moshly" />
  <title>Moshly</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #070a14;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% 8%, rgba(107,92,255,0.2), transparent 55%),
        radial-gradient(ellipse 60% 50% at 85% 90%, rgba(0,209,255,0.1), transparent 55%);
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px calc(80px + env(safe-area-inset-bottom, 16px));
    }

    /* ── Topbar ──────────────────────────────────────────── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      padding-bottom: 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
    }

    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 7px;
    }

    .dashboard-link {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.15s;
    }
    .dashboard-link:hover { color: rgba(255,255,255,0.85); }

    /* ── Welcome ─────────────────────────────────────────── */
    .welcome {
      padding: 28px 0 32px;
    }

    .welcome-name {
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }

    .welcome-name span {
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #launcher-live-datetime {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 10px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }

    .launcher-time {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255,255,255,0.55);
      letter-spacing: -0.01em;
    }

    /* ── Pending alert ───────────────────────────────────── */
    .pending-alert {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(107,92,255,0.4);
      background: rgba(107,92,255,0.1);
      color: #c4b8ff;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pending-alert:hover { background: rgba(107,92,255,0.2); }
    .pending-alert[hidden] { display: none !important; }
    .pending-alert-cta { margin-left: auto; opacity: 0.6; font-size: 11px; }

    /* ── Section wrapper ─────────────────────────────────── */
    .icon-section {
      margin-bottom: 36px;
    }

    .icon-section[hidden] { display: none !important; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 16px;
    }

    /* ── App card list ───────────────────────────────────── */
    .app-card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── App card ─────────────────────────────────────────── */
    .app-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      text-decoration: none;
      color: inherit;
      cursor: default;
      transition: background 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .app-card:hover {
      background: rgba(255,255,255,0.065);
      border-color: rgba(255,255,255,0.13);
    }

    .app-card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Icon — spans 2 text rows */
    .app-card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .app-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
      transform: scale(1.15);
      display: block;
    }

    .app-card-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .app-card-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.15;
    }
    .app-card-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #4ade80;
      width: fit-content;
    }
    .app-card-live::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      flex-shrink: 0;
    }
    .app-card-soon {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      width: fit-content;
    }
    .app-card-peek-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(107,92,255,0.2);
      border: 1px solid rgba(107,92,255,0.35);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #c4b8ff;
      width: fit-content;
    }

    .app-card-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      line-height: 1.45;
      padding: 0 2px;
    }

    /* Use App button */
    .app-card-use {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-family: inherit;
    }
    .app-card-use:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.82);
    }
    .app-card-use:active {
      background: rgba(255,255,255,0.12);
    }

    /* Cancel X — top right, hover only */
    .app-card-cancel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,100,100,0.3);
      color: rgba(255,100,100,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.12s ease, background 0.12s, color 0.12s, border-color 0.12s;
      font-family: inherit;
    }
    .app-card:hover .app-card-cancel {
      opacity: 1;
    }
    .app-card-cancel:hover {
      background: rgba(255,80,80,0.15);
      border-color: rgba(255,100,100,0.6);
      color: rgba(255,120,120,0.9);
    }

    /* Coming soon card */
    .app-card--soon {
      pointer-events: none;
      opacity: 0.45;
      filter: saturate(0.3);
    }

    /* Empty slot card */
    .app-card-empty {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: transparent;
      border: 1.5px dashed rgba(255,255,255,0.1);
      text-decoration: none;
      color: rgba(255,255,255,0.28);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .app-card-empty:hover {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.45);
    }
    .app-card-empty-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 200;
      flex-shrink: 0;
    }
    .app-card-empty-label {
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Fixed bottom dock ───────────────────────────────── */
    .dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 10px 24px calc(10px + env(safe-area-inset-bottom, 12px));
      background: rgba(7,10,20,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.07);
      z-index: 10;
    }

    .dock-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 28px;
      border-radius: 999px;
      background: rgba(107,92,255,0.18);
      border: 1px solid rgba(107,92,255,0.32);
      color: #c4b8ff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      letter-spacing: -0.01em;
    }

    .dock-btn:hover {
      background: rgba(107,92,255,0.3);
      border-color: rgba(107,92,255,0.5);
    }

    .dock-btn svg {
      opacity: 0.75;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header class="topbar">
      <a class="brand" href="/">
        <img src="assets/Moshly-Main-Logo-1.svg" alt="Moshly" />
        Moshly
      </a>
      <a class="dashboard-link" href="/dashboard" id="launcherBackToDashboardTop">Dashboard →</a>
    </header>

    <section class="welcome">
      <div class="welcome-name"><span data-first-name>…</span></div>
      <div id="launcher-live-datetime" aria-live="polite">
        <span>--/--/----</span>
        <span class="launcher-time">--:--</span>
      </div>
    </section>

    <a class="pending-alert" id="launcherPendingAlert" href="/dashboard?open_connector=1" hidden aria-live="polite">
      <span>🕐</span>
      <span id="launcherPendingAlertText">App change pending…</span>
      <span class="pending-alert-cta">Manage →</span>
    </a>

    <!-- Plan Apps -->
    <div class="icon-section" id="mainAppsSection">
      <div class="section-label">My Apps</div>
      <div class="app-card-list" id="dbAppsGrid"></div>
    </div>

    <!-- Free Apps -->
    <div class="icon-section" id="freeAppsSection" hidden>
      <div class="section-label">Free</div>
      <div class="app-card-list" id="dbFreeAppsGrid"></div>
    </div>

    <!-- Peek Slot -->
    <div class="icon-section" id="dbPeekSection" hidden>
      <div class="section-label">Peek — 24h</div>
      <div class="app-card-list" id="dbPeekGrid"></div>
    </div>

  </div>

  <!-- Bottom dock: return to dashboard -->
  <nav class="dock">
    <a class="dock-btn" href="/dashboard" id="launcherBackToDashboardBottom">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      Full Dashboard
    </a>
  </nav>

  <script src="/auth-client.js"></script>
  <script src="/moshly-ui.js"></script>
  <script>
    const APP_CATALOG = [
      {
        slug: 'feeme', name: 'FeeMe', status: 'live',
        iconAsset: '/assets/Moshly-Main-Logo-nofill.svg', url: '/apps/feeme.html',
        type: 'Plan app', categories: ['Business', 'Analytics'],
        desc: 'Fee management for independent artists'
      },
      {
        slug: 'fifthsense', name: 'Fifth Sense', status: 'live',
        iconAsset: '/assets/moshly-FifhtSense-logo-svg.svg', url: '/apps/fifthsense.html',
        type: 'Free', categories: ['Learning', 'Interactive'],
        desc: 'Interactive music & learning experience'
      },
      {
        slug: 'merchpad', name: 'MerchPad', status: 'live',
        iconAsset: '/assets/moshly-merchpad-logo-svg.svg', url: 'https://merchpad.moshly.io',
        type: 'Plan app', categories: ['Business', 'Booking'],
        desc: 'Merchandise booking and management'
      },
      {
        slug: 'rank', name: 'Rank', status: 'live',
        iconAsset: '/assets/moshly-rank-logo-svg.svg', url: 'https://rank.moshly.io',
        type: 'Plan app', categories: ['Business'],
        desc: 'SEO visibility tool for independent artists'
      }
    ];


    // Records that the user launched from the Launcher so the spoke knows where to return.
    function markLaunchOrigin() {
      try { localStorage.setItem('moshly_hub_return', 'launcher'); } catch (_) {}
    }

    // SSO launch for external spoke apps (rank.moshly.io, merchpad.moshly.io).
    window.launchApp = async function(appUrl) {
      markLaunchOrigin();
      try {
        const res = await window.MoshlyAuth.authFetch('/api/auth/sso/token', { method: 'POST' });
        const data = await res.json();
        if (!data.token) throw new Error('no SSO token returned');
        window.location.href = `${appUrl}/auth/callback?token=${encodeURIComponent(data.token)}`;
      } catch (err) {
        console.error('[Launcher] SSO launch failed:', err);
        const toast = document.createElement('div');
        toast.textContent = 'Could not connect — try again';
        toast.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:1px solid rgba(255,100,50,.5);color:#ff8a65;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;pointer-events:none';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }
    };

    // Auth guard
    (async () => {
      const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const useDevMock = isLocalDev && new URLSearchParams(location.search).get('dev_mock') !== '0';

      if (!useDevMock) {
        const ok = await window.MoshlyAuth.requireSession('/login');
        if (!ok) return;
      }

      // ── Sync "View Full Dashboard" links ─────────────────
      const DASH_RETURN_KEY = 'moshly_dash_return_dashboard_v1';
      const KNOWN_DEV_PLANS = new Set(['free','solo','collective','business','major','god','semi_god']);

      function resolveDashboardTarget() {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = (params.get('return_dashboard') || '').trim();
        const fromStorage = (localStorage.getItem(DASH_RETURN_KEY) || '').trim();
        const candidate = fromQuery || fromStorage;

        if (candidate) {
          try {
            const parsed = new URL(candidate, window.location.origin);
            if (parsed.origin === window.location.origin && /\/dashboard(\.html)?$/.test(parsed.pathname)) {
              const target = `${parsed.pathname}${parsed.search}${parsed.hash}`;
              localStorage.setItem(DASH_RETURN_KEY, target);
              return target;
            }
          } catch (_) {}
        }

        if (isLocalDev) {
          try {
            const user = JSON.parse(localStorage.getItem('moshly_user') || 'null');
            const plan = String(user?.plan || '').toLowerCase();
            if (KNOWN_DEV_PLANS.has(plan)) {
              return `/dashboard?dev_plan=${encodeURIComponent(plan)}&dev_mock=1`;
            }
          } catch (_) {}
        }

        return '/dashboard';
      }

      (function syncDashboardLinks() {
        const target = resolveDashboardTarget();
        ['launcherBackToDashboardTop', 'launcherBackToDashboardBottom'].forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.setAttribute('href', target);
          el.addEventListener('click', function () {
            this.setAttribute('href', resolveDashboardTarget());
          });
        });
      })();

      // ── Build card HTML ───────────────────────────────────
      function buildCardHTML(app, peekBadge) {
        const isSoon = app.status === 'soon';
        const isExternal = app.url.startsWith('https://');

        let statusBadge;
        if (peekBadge) {
          statusBadge = `<span class="app-card-peek-badge">Peek — 24h</span>`;
        } else if (isSoon) {
          statusBadge = `<span class="app-card-soon">Soon</span>`;
        } else {
          statusBadge = `<span class="app-card-live">Live</span>`;
        }

        const launchAttr = isExternal
          ? `onclick="window.launchApp('${app.url}')"`
          : `onclick="markLaunchOrigin(); window.location.href='${app.url}'"`;

        const cancelBtn = isSoon ? '' : `<button class="app-card-cancel" aria-label="Remove app" onclick="event.stopPropagation()">×</button>`;
        const descHTML = app.desc ? `<div class="app-card-desc">${app.desc}</div>` : '';
        const useBtn = isSoon ? '' : `<button class="app-card-use" ${launchAttr}>Use App</button>`;

        return `
          <div class="app-card${isSoon ? ' app-card--soon' : ''}">
            ${cancelBtn}
            <div class="app-card-top">
              <div class="app-card-icon">
                <img src="${app.iconAsset}" alt="${app.name}" loading="lazy">
              </div>
              <div class="app-card-meta">
                <div class="app-card-name">${app.name}</div>
                ${statusBadge}
              </div>
            </div>
            ${descHTML}
            ${useBtn}
          </div>`;
      }

      function buildEmptySlotHTML(label) {
        return `
          <a class="app-card-empty" href="/dashboard?open_connector=1">
            <div class="app-card-empty-icon">+</div>
            <span class="app-card-empty-label">${label}</span>
          </a>`;
      }

      // ── Render app grids ──────────────────────────────────
      function updateLauncherAppsUI(user) {
        const appsGrid    = document.getElementById('dbAppsGrid');
        const freeGrid    = document.getElementById('dbFreeAppsGrid');
        const peekGrid    = document.getElementById('dbPeekGrid');
        const freeSection = document.getElementById('freeAppsSection');
        const peekSection = document.getElementById('dbPeekSection');

        if (!appsGrid) return;

        if (!user.apps && user.profile?.connectedApps) {
          user.apps = user.profile.connectedApps;
        }

        const activeAppSlugs = Array.isArray(user.apps)
          ? [...new Set(user.apps.map((s) => {
              const n = s.toLowerCase().trim();
              return n === 'fifth sense' ? 'fifthsense' : n;
            }))]
          : [];

        const activeApps = APP_CATALOG.filter((a) =>
          activeAppSlugs.includes(a.slug.toLowerCase())
        );

        const plan = (user.subscription?.plan || user.plan || 'free').toLowerCase();
        const SLOT_MAP = {
          free: 0, solo: 2, collective: 4, business: 10,
          major: 150, starter: 3, pro: 9, elite: 15, god: 150, semi_god: 150,
        };
        const totalSlots = SLOT_MAP[plan] ?? (plan === 'free' ? 0 : 3);

        // 1. Plan apps
        const activeMainApps = activeApps.filter((a) => a.type !== 'Free');
        let appsHtml = activeMainApps.map((a) => buildCardHTML(a, null)).join('');

        const usedCount    = activeMainApps.length;
        const baseSlots    = Math.max(3, parseInt(localStorage.getItem('moshly_setting_empty_slots') || '12', 10));
        const displaySlots = Math.max(baseSlots, usedCount < 3 ? 3 : Math.ceil(usedCount / 3) * 3);
        const effectiveTotal = Math.max(usedCount, Math.min(totalSlots, displaySlots));
        const emptyCount   = Math.max(0, effectiveTotal - usedCount);

        for (let i = 0; i < emptyCount; i++) appsHtml += buildEmptySlotHTML('Add App');
        appsGrid.innerHTML = appsHtml;

        // 2. Free apps
        const activeFreeApps = activeApps.filter((a) => a.type === 'Free');
        if (activeFreeApps.length > 0 && freeGrid && freeSection) {
          let freeHtml = activeFreeApps.map((a) => buildCardHTML(a, null)).join('');
          const emptyFreeCount = Math.max(0, 3 - activeFreeApps.length);
          for (let i = 0; i < emptyFreeCount; i++) freeHtml += buildEmptySlotHTML('Explore');
          freeGrid.innerHTML = freeHtml;
          freeSection.hidden = false;
        }

        // 3. Peek slot
        if (peekGrid && peekSection) {
          const peekApp = APP_CATALOG.find((a) => a.slug === (user.peek_app || '').toLowerCase());
          if (peekApp) {
            peekGrid.innerHTML = buildCardHTML(peekApp, 'Peek');
            peekSection.hidden = false;
          }
        }
      }

      // ── Init: fetch user, fall back to cache ──────────────
      (async function initLauncher() {
        try {
          const { ok, data } = await window.MoshlyAuth.authFetch('/me');
          if (ok && data.user) {
            const user = data.user;
            if (user.profile?.uxSettings?.emptySlots) {
              localStorage.setItem('moshly_setting_empty_slots', user.profile.uxSettings.emptySlots);
            }
            const firstName = (user.name || '').split(' ')[0] || (user.profile?.firstName) || '';
            if (firstName) {
              document.querySelectorAll('[data-first-name]').forEach((el) => { el.textContent = firstName; });
            }
            updateLauncherAppsUI(user);
            return;
          }
        } catch (err) {
          console.warn('[Launcher] /me fetch failed, using cache:', err);
        }
        try {
          const user = JSON.parse(localStorage.getItem('moshly_user') || 'null');
          if (user) updateLauncherAppsUI(user);
        } catch (_) {}
      })();

      // ── Sync user name ────────────────────────────────────
      (function syncName() {
        let firstName = (new URLSearchParams(location.search).get('first') || '').trim();
        if (!firstName) {
          try {
            const u = JSON.parse(localStorage.getItem('moshly_user') || 'null');
            firstName = u?.name?.split(' ')[0] || '';
          } catch (_) {}
        }
        document.querySelectorAll('[data-first-name]').forEach((el) => {
          el.textContent = firstName || 'Hey';
        });
      })();

      // ── Pending app-change alert ──────────────────────────
      (async function syncPendingAlert() {
        const alertEl = document.getElementById('launcherPendingAlert');
        const textEl  = document.getElementById('launcherPendingAlertText');
        if (!alertEl || !textEl) return;

        function formatTimeLeft(effectiveAt) {
          const diff = new Date(effectiveAt) - Date.now();
          if (diff <= 0) return null;
          const d = Math.floor(diff / 86400000);
          const h = Math.floor((diff % 86400000) / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          return [d && `${d}d`, h && `${h}h`, `${m}m`].filter(Boolean).join(' ');
        }

        try {
          let pending = null;
          if (useDevMock) {
            const u = JSON.parse(localStorage.getItem('moshly_user') || 'null');
            pending = u?.pending_change ?? null;
          } else {
            const res = await window.MoshlyAuth.authFetch('/apps/state');
            if (res.ok && res.data) pending = res.data.pending_change ?? null;
          }
          if (!pending?.effective_at) return;

          const label = formatTimeLeft(pending.effective_at);
          if (!label) return;
          textEl.textContent = `App change in ${label}`;
          alertEl.hidden = false;

          setInterval(() => {
            const l = formatTimeLeft(pending.effective_at);
            if (!l) { alertEl.hidden = true; return; }
            textEl.textContent = `App change in ${l}`;
          }, 30000);
        } catch (_) {}
      })();

      // ── Live clock ────────────────────────────────────────
      (function syncClock() {
        const el = document.getElementById('launcher-live-datetime');
        if (!el) return;
        const locale = navigator.language || 'pt-PT';

        function paint() {
          const now = new Date();
          const date = now.toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: 'numeric' });
          const time = now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          el.innerHTML = `<span>${date}</span><span class="launcher-time">${time}</span>`;
        }

        paint();
        setInterval(paint, 1000);
      })();

    })(); // end auth guard
  </script>
</body>
</html>
