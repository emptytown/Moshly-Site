<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070a14" />
  <title>Moshly Apps</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070a14;
      --panel: rgba(18, 22, 43, 0.92);
      --panel-border: rgba(107, 92, 255, 0.28);
      --text: #e8ecff;
      --muted: #9aa0be;
      --accent: #6b5cff;
      --accent-2: #00d1ff;
      --ok: #4ade80;

      /* Dashboard Mirror Tokens */
      --color-bg-primary: #0E0F14;
      --color-bg-secondary: #141624;
      --color-bg-surface: #1B1E2E;
      --color-text-primary: #E6E7EB;
      --color-text-secondary: #A4A7B5;
      --color-text-tertiary: #7B7F93;
      --color-accent-primary: #6B5CFF;
      --color-accent-hover: #7C6DFF;
      --color-border-subtle: #24273A;
      --color-border-strong: #2D3048;
      --radius-md: 10px;
      --radius-lg: 16px;
      --space-md: 16px;
      --space-lg: 24px;
      --duration-fast: 0.2s;
      --font-size-xs: 11px;
      --font-family-base: "Inter", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(107, 92, 255, 0.2), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(0, 209, 255, 0.12), transparent 40%),
        var(--bg);
      min-height: 100vh;
    }

    /* ══ DASHBOARD MIRROR STYLES ══════════════════ */
    .db-card {
      background: linear-gradient(180deg, rgba(18, 22, 43, 0.9), rgba(14, 18, 36, 0.88));
      border: 1px solid rgba(107, 92, 255, 0.24);
      border-radius: var(--radius-lg);
      padding: 18px;
      transition: all var(--duration-fast);
      box-sizing: border-box;
      backdrop-filter: blur(5px);
      box-shadow: 0 12px 28px rgba(7, 10, 24, 0.35);
      margin-bottom: 24px;
    }
    .db-card:hover {
      border-color: rgba(107, 92, 255, 0.5);
      box-shadow: 0 12px 34px rgba(107, 92, 255, 0.18);
    }
    .db-section-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 20px;
    }
    .db-section-title {
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--color-text-tertiary);
      margin: 0;
    }
    .db-section-subtitle {
      font-size: 11px;
      color: var(--color-text-tertiary);
      opacity: 0.7;
      margin: 0;
    }
    .db-apps-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-md);
        margin-bottom: var(--space-lg);
    }
    .db-app-slot {
        min-height: 200px;
        border-radius: var(--radius-lg);
        transition: all var(--duration-fast);
        display: flex;
        flex-direction: column;
        background: var(--color-bg-secondary);
        border: 1px solid var(--color-border-subtle);
        padding: 20px;
        text-decoration: none;
        color: inherit;
        position: relative;
    }
    .db-app-slot:not(.db-app-slot--empty):hover {
        border-color: rgba(107, 92, 255, 0.4);
        transform: translateY(-2px);
    }
    .db-app-slot-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--color-bg-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        flex-shrink: 0;
    }
    .db-app-slot-icon img {
        width: 32px;
        height: 32px;
        object-fit: contain;
    }
    .db-app-slot-info {
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .db-app-slot-name {
        font-size: 15px;
        font-weight: 700;
        color: var(--color-text-primary);
        margin-bottom: 4px;
    }
    .db-app-slot-desc {
        font-size: 12px;
        color: var(--color-text-tertiary);
        margin-bottom: 12px;
        line-height: 1.4;
    }
    .db-app-slot-status {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-accent-primary);
        margin-bottom: 12px;
        padding: 4px 8px;
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-subtle);
        border-radius: 4px;
        display: block;
        width: fit-content;
    }
    .db-app-slot-action {
        margin-top: auto;
    }
    .db-app-slot-btn {
        width: 100%;
        padding: 8px 12px;
        border-radius: var(--radius-md);
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border-strong);
        color: var(--color-text-primary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--duration-fast);
        text-align: center;
    }
    .db-app-slot-btn:hover {
        background: var(--color-accent-primary);
        color: #fff;
        border-color: var(--color-accent-primary);
    }
    .db-app-slot--empty {
        border: 2px dashed rgba(107, 92, 255, 0.25);
        background: rgba(107, 92, 255, 0.03);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--color-text-tertiary);
        cursor: pointer;
    }
    .db-app-slot--empty:hover {
        border-color: rgba(107, 92, 255, 0.45);
        background: rgba(107, 92, 255, 0.06);
    }
    .db-app-slot-empty-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .db-app-slot-plus-circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid currentColor;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 400;
        opacity: 0.6;
        transition: all var(--duration-fast);
    }
    .db-app-slot--empty:hover .db-app-slot-plus-circle {
        opacity: 1;
        transform: scale(1.1);
        color: var(--color-accent-primary);
    }
    .db-app-slot-label {
        font-size: 13px;
        font-weight: 600;
        opacity: 0.8;
    }
    .db-hidden { display: none !important; }

    /* Peek Slot Section */
    .db-peek-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--color-border-subtle);
    }
    .db-peek-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-md);
    }
    .db-app-slot--peek {
        border-color: var(--color-accent-primary);
        background: rgba(107, 92, 255, 0.04);
    }
    .db-app-slot--peek .db-app-slot-status {
        color: #fff;
        background: var(--color-accent-primary);
        border-color: var(--color-accent-primary);
    }

    /* Free Section */
    .db-free-apps-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--color-border-subtle);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(71, 84, 153, 0.22) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.45;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(980px, 92vw);
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-1px); border-color: rgba(107, 92, 255, 0.6); }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(107, 92, 255, 0.32);
    }

    .btn-ghost {
      color: var(--text);
      background: rgba(16, 20, 40, 0.75);
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      font-weight: 900;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    #launcher-live-datetime {
      margin: 10px 0 0;
      display: inline-flex;
      align-items: baseline;
      gap: 22px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(107, 92, 255, 0.25);
      background: rgba(15, 20, 42, 0.55);
      color: #aab0ce;
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .launcher-time {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #f2f5ff;
      text-shadow: 0 0 14px rgba(107, 92, 255, 0.38);
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .launcher-pending-alert {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(107,92,255,.42);
      background: linear-gradient(180deg, rgba(107,92,255,.15), rgba(107,92,255,.07));
      color: #c4b8ff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .16s, background .16s;
    }
    .launcher-pending-alert[hidden] { display: none !important; }
    .launcher-pending-alert:hover { border-color: rgba(107,92,255,.7); background: rgba(107,92,255,.22); }
    .launcher-pending-alert-icon { font-size: 16px; flex-shrink: 0; }
    .launcher-pending-alert-cta { margin-left: auto; font-size: 11px; font-weight: 700; white-space: nowrap; opacity: .7; }

    .app-card {
      position: relative;
      border: 1px solid rgba(107, 92, 255, 0.24);
      background: var(--panel);
      border-radius: 18px;
      margin: 15px;
      padding: 11px;
      text-decoration: none;
      color: inherit;
      min-height: 192px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .app-card:hover {
      transform: translateY(-2px);
      border-color: rgba(107, 92, 255, 0.6);
      box-shadow: 0 14px 28px rgba(10, 14, 35, 0.55);
    }

    /* App visível mas não activado — shaded */
    .app-card.shown-inactive {
      opacity: 0.42;
      filter: saturate(0.3);
      pointer-events: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--ok);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      width: fit-content;
      background: rgba(74, 222, 128, 0.08);
    }

    .pill-muted {
      color: #a6abca;
      border-color: rgba(107, 113, 150, 0.34);
      background: rgba(44, 49, 74, 0.4);
    }

    .pill-active {
      background: rgba(74, 222, 128, 0.12);
      color: var(--ok);
      border-color: rgba(74, 222, 128, 0.2);
    }

    .pill-inactive {
      background: rgba(154, 160, 190, 0.1);
      color: #9aa0be;
      border-color: rgba(154, 160, 190, 0.2);
    }

    .app-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 8px;
    }

    .app-head img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      object-fit: cover;
    }

    .app-title { font-weight: 800; letter-spacing: -0.02em; }
    .app-sub { color: var(--muted); font-size: 12px; }

    .cta {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 38px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(107, 92, 255, 0.34);
      background: rgba(17, 21, 45, 0.75);
    }

    .app-card.live .cta { color: #dfe4ff; }
    .app-card.coming .cta { color: #9fa7cb; }

    .footer-cta {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    @media (max-width: 860px) {
      .wrap { width: min(700px, 92vw); }
      .db-apps-grid, .db-peek-grid { grid-template-columns: repeat(2, 1fr); }
      .topbar { margin-bottom: 14px; }
      .hero { flex-direction: column; align-items: flex-start; }
      .hero h1 { font-size: clamp(24px, 9vw, 36px); }
    }
    @media (max-width: 580px) {
      .db-apps-grid, .db-peek-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img src="assets/Moshly-Main-Logo-1.svg" alt="Moshly" />
        <span>Moshly Apps</span>
      </div>
      <a class="btn btn-ghost" href="/dashboard" id="launcherBackToDashboardTop">View Full Dashboard</a>
    </header>

    <section class="hero">
      <div>
        <h1>Welcome, <span data-first-name>UserName</span></h1>
        <p id="launcher-live-datetime" aria-live="polite"><span>--/--/----</span><span class="launcher-time">--:--:--</span></p>
      </div>
    </section>

    <div class="db-card">
        <!-- APP SLOTS SECTION -->
        <div class="db-section-header">
            <h2 class="db-section-title">My Apps Slots</h2>
            <p class="db-section-subtitle">Permanent apps available in your plan.</p>
        </div>
        <div class="db-apps-grid" id="dbAppsGrid"></div>

        <!-- Free Apps Section -->
        <div class="db-free-apps-section" id="dbFreeSection">
            <div class="db-section-header">
                <h2 class="db-section-title">Free Apps</h2>
                <p class="db-section-subtitle">Apps available for everyone.</p>
            </div>
            <div class="db-apps-grid" id="dbFreeAppsGrid"></div>
        </div>

        <!-- PEEK SLOT SECTION -->
        <div class="db-peek-section db-hidden" id="dbPeekSection">
            <div class="db-section-header">
                <h2 class="db-section-title">Peek Slot</h2>
                <p class="db-section-subtitle">Temporary 24h access to any app.</p>
            </div>
            <div class="db-peek-grid" id="dbPeekGrid"></div>
        </div>
    </div>

    <a class="launcher-pending-alert" id="launcherPendingAlert" href="/connect-more" hidden aria-live="polite">
      <span class="launcher-pending-alert-icon">🕐</span>
      <span id="launcherPendingAlertText">App change pending…</span>
      <span class="launcher-pending-alert-cta">Manage →</span>
    </a>

    <div class="footer-cta">
      <a class="btn btn-primary" href="/dashboard" id="launcherBackToDashboardBottom">View Full Dashboard</a>
    </div>
  </div>

  <script src="/auth-client.js"></script>
  <script src="/moshly-ui.js"></script>
  <script>
    // Global APP_CATALOG mirrored from dashboard-logic.js
    const APP_CATALOG = [
        { 
            slug: 'feeme', name: 'FeeMe', description: 'Financial hub', 
            status: 'live', iconAsset: 'assets/feeme-logo-icon.svg', url: 'apps/feeme.html',
            type: 'Plan app', categories: ['Business', 'Analytics']
        },
        { 
            slug: 'fifthsense', name: 'Fifth Sense', description: 'Interactive Circle of Fifths', 
            status: 'live', iconAsset: 'assets/Moshly-Main-Logo-nofill.svg', url: 'apps/fifthsense.html',
            type: 'Free', categories: ['Learning', 'Interactive']
        },
        { 
            slug: 'brainroom', name: 'BrainRoom', description: 'AI-powered workspace', 
            status: 'live', iconAsset: 'assets/BrainRoom-icon-svg.svg', url: 'https://brainroom.moshly.io',
            type: 'Plan app', categories: ['Creative', 'Planning', 'Tools']
        },
        { 
            slug: 'moshly core', name: 'Moshly Core', description: 'Base Platform', 
            status: 'live', iconAsset: 'assets/Moshly-Main-Logo-darkoutline.svg', url: 'https://moshly.io',
            type: 'Free', categories: ['Tools']
        },
        { 
            slug: 'app guide', name: 'App Guide', description: 'Tutorials & Help', 
            status: 'live', iconAsset: 'assets/Moshly-Main-Logo-1.svg', url: 'https://moshly.io/docs',
            type: 'Free', categories: ['Tour', 'Learning']
        },
        { 
            slug: 'rbapp', name: 'RBapp', description: 'Interactive Roadbooks', 
            status: 'soon', iconAsset: 'assets/rbapp-logo-icon.svg', url: 'https://rbapp.moshly.io',
            type: 'Plan app', categories: ['Planning', 'Interactive']
        },
        { 
            slug: 'merchpad', name: 'MerchPad', description: 'Merch management',
            status: 'soon', iconAsset: 'assets/merchpad-logo-icon.svg', url: 'https://merchpad.moshly.io',
            type: 'Plan app', categories: ['Business', 'Booking']
        }
    ];

    // SSO launch: generates a 60s token and redirects to the app's /auth/callback
    window.launchApp = async function(appUrl) {
        try {
            const res = await window.MoshlyAuth.authFetch('/api/auth/sso/token');
            const data = await res.json();
            if (!data.token) throw new Error('no token returned');
            window.location.href = `${appUrl}/auth/callback?token=${encodeURIComponent(data.token)}`;
        } catch (e) {
            console.error('SSO launch failed:', e);
        }
    };

    // Guard: redirect to login if no session.
    (async () => {
      const isLocalDevHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const useDevMock = isLocalDevHost && new URLSearchParams(location.search).get('dev_mock') !== '0';
      if (!useDevMock) {
        const ok = await window.MoshlyAuth.requireSession('/login');
        if (!ok) return;
      }


    const DASH_RETURN_STORAGE_KEY = 'moshly_dash_return_dashboard_v1';

    (function syncBackToDashboardLinks() {
      const isLocalDevHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const knownDevPlans = new Set(['free', 'solo', 'collective', 'business', 'major', 'god', 'semi_god']);
      const resolveTarget = () => {
        const params = new URLSearchParams(window.location.search);
        const returnDashFromQuery = (params.get('return_dashboard') || '').trim();
        const returnDashFromStorage = (localStorage.getItem(DASH_RETURN_STORAGE_KEY) || '').trim();
        const returnDash = returnDashFromQuery || returnDashFromStorage;

        if (returnDash) {
          try {
            const parsed = new URL(returnDash, window.location.origin);
            if (parsed.origin === window.location.origin && /\/dashboard\.html$/.test(parsed.pathname)) {
              const target = `${parsed.pathname}${parsed.search}${parsed.hash}`;
              localStorage.setItem(DASH_RETURN_STORAGE_KEY, target);
              return target;
            }
          } catch {
            // Ignore malformed values and try localhost fallback.
          }
        }

        if (isLocalDevHost) {
          try {
            const user = JSON.parse(localStorage.getItem('moshly_user') || 'null');
            const plan = String(user?.plan || '').toLowerCase();
            if (knownDevPlans.has(plan)) {
              return `/dashboard?dev_plan=${encodeURIComponent(plan)}&dev_mock=1`;
            }
          } catch {
            // Ignore parse errors and use default target.
          }
        }

        return '/dashboard';
      };

      const target = resolveTarget();
      const top = document.getElementById('launcherBackToDashboardTop');
      const bottom = document.getElementById('launcherBackToDashboardBottom');
      [top, bottom].forEach((btn) => {
        if (!btn) return;
        btn.setAttribute('href', target);
        btn.onclick = function () {
          this.setAttribute('href', resolveTarget());
        };
      });
    })();

    function updateLauncherAppsUI(user) {
        const appsGrid = document.getElementById('dbAppsGrid');
        const freeGrid = document.getElementById('dbFreeAppsGrid');
        const peekGrid = document.getElementById('dbPeekGrid');
        if (!appsGrid) return;

        // Sync user apps from profile if missing
        if (!user.apps && user.profile?.connectedApps) {
            user.apps = user.profile.connectedApps;
        }

        const activeAppSlugs = Array.isArray(user.apps) ? user.apps.map(s => s.toLowerCase().trim()) : [];
        const uniqueActiveAppSlugs = [...new Set(activeAppSlugs.map(s => {
            const normalized = s.toLowerCase().trim();
            if (normalized === 'fifth sense') return 'fifthsense';
            if (normalized === 'moshly core') return 'moshly core';
            if (normalized === 'app guide') return 'app guide';
            return normalized;
        }))];
        const activeApps = APP_CATALOG.filter(a => uniqueActiveAppSlugs.includes(a.slug.toLowerCase().trim()));

        const plan = (user.subscription?.plan || user.plan || 'free').toLowerCase();
        // Comprehensive slot map for ALL plan names used in dev and production
        const slotMap = {
            'free': 0,
            'solo': 2,
            'collective': 4,
            'business': 10,
            'major': 150,
            'starter': 3,
            'pro': 9,
            'elite': 15,
            'god': 150,
            'semi_god': 150
        };
        const totalSlots = slotMap[plan] === undefined ? (plan === 'free' ? 0 : 3) : slotMap[plan];
        
        console.log('Launcher Sync: Slot calculation', { plan, totalSlots, userPlan: user.plan, subPlan: user.subscription?.plan });

        const activeMainApps = activeApps.filter(a => a.type !== 'Free');

        // 1. Permanent Slots
        let appsHtml = activeMainApps.map(app => {
            const linkAttr = app.url.includes('.moshly.io')
                ? `href="javascript:void(0)" onclick="window.launchApp('${app.url}')"`
                : `href="${app.url}"`;
            return `
            <a ${linkAttr} class="db-app-slot">
                <div class="db-app-slot-icon">
                    <img src="${app.iconAsset}" alt="${app.name}">
                </div>
                <div class="db-app-slot-info">
                    <div class="db-app-slot-name">${app.name}</div>
                    <div class="db-app-slot-desc">${app.description}</div>
                    <div class="db-app-slot-status">Live</div>
                    <div class="db-app-slot-action">
                        <div class="db-app-slot-btn">Open App</div>
                    </div>
                </div>
            </a>
        `;
        }).join('');

        const usedCount = activeMainApps.length;
        const baseSlots = parseInt(localStorage.getItem('moshly_setting_empty_slots') || '12', 10);
        let displayedSlots = Math.max(baseSlots, usedCount < 3 ? 3 : Math.floor(usedCount / 3) * 3 + 3);
        
        // Ensure even Free plan shows some empty slots if needed, but here we honor plan limits
        // for "Permanent Slots". For Free plan, totalSlots is 0.
        // We ensure we at least show whatever they have connected.
        const effectiveTotal = Math.max(usedCount, Math.min(totalSlots, displayedSlots));
        const emptySlotsCount = Math.max(0, effectiveTotal - usedCount);

        console.log('Launcher Sync: Permanent Slot rendering', { usedCount, baseSlots, displayedSlots, totalSlots, effectiveTotal, emptySlotsCount });

        const goToConnector = "window.location.href='/dashboard?open_connector=1'";
        for (let i = 0; i < emptySlotsCount; i++) {
            appsHtml += `
                <a href="javascript:void(0)" class="db-app-slot db-app-slot--empty" onclick="${goToConnector}">
                    <div class="db-app-slot-empty-content">
                        <div class="db-app-slot-plus-circle">+</div>
                        <span class="db-app-slot-label">Connect App</span>
                    </div>
                </a>
            `;
        }
        appsGrid.innerHTML = appsHtml;

        // 2. Free Apps
        if (freeGrid) {
            const allFreeApps = APP_CATALOG.filter(a => a.type === 'Free');
            const activeFreeApps = activeApps.filter(a => a.type === 'Free');
            
            let freeHtml = activeFreeApps.map(app => `
                <a href="${app.url}" class="db-app-slot">
                    <div class="db-app-slot-icon">
                        <img src="${app.iconAsset}" alt="${app.name}">
                    </div>
                    <div class="db-app-slot-info">
                        <div class="db-app-slot-name">${app.name}</div>
                        <div class="db-app-slot-desc">${app.description}</div>
                        <div class="db-app-slot-status">Free</div>
                        <div class="db-app-slot-action">
                            <div class="db-app-slot-btn">Open App</div>
                        </div>
                    </div>
                </a>
            `).join('');

            const usedFreeCount = activeFreeApps.length;
            let displayedFreeSlots = usedFreeCount < 3 ? 3 : Math.floor(usedFreeCount / 3) * 3 + 3;
            const emptyFreeSlotsCount = Math.max(0, displayedFreeSlots - usedFreeCount);

            for (let i = 0; i < emptyFreeSlotsCount; i++) {
                freeHtml += `
                    <a href="javascript:void(0)" class="db-app-slot db-app-slot--empty" onclick="${goToConnector}">
                        <div class="db-app-slot-empty-content">
                            <div class="db-app-slot-plus-circle">+</div>
                            <span class="db-app-slot-label">Connect Free App</span>
                        </div>
                    </a>
                `;
            }
            freeGrid.innerHTML = freeHtml;
        }

        // 3. Peek Slot
        if (peekGrid) {
            const peekSection = document.getElementById('dbPeekSection');
            if (peekSection) peekSection.classList.remove('db-hidden');
            const peekAppSlug = user.peek_app?.toLowerCase();
            const peekApp = APP_CATALOG.find(a => a.slug === peekAppSlug);

            if (peekApp) {
                const peekLinkAttr = peekApp.url.includes('.moshly.io')
                    ? `href="javascript:void(0)" onclick="window.launchApp('${peekApp.url}')"`
                    : `href="${peekApp.url}"`;
                peekGrid.innerHTML = `
                    <a ${peekLinkAttr} class="db-app-slot db-app-slot--peek">
                        <div class="db-app-slot-icon">
                            <img src="${peekApp.iconAsset}" alt="${peekApp.name}">
                        </div>
                        <div class="db-app-slot-info">
                            <div class="db-app-slot-name">${peekApp.name}</div>
                            <div class="db-app-slot-desc">${peekApp.description}</div>
                            <div class="db-app-slot-status">Peek Active</div>
                            <div class="db-app-slot-action">
                                <div class="db-app-slot-btn">Open App</div>
                            </div>
                        </div>
                    </a>
                `;
            } else {
                peekGrid.innerHTML = `
                    <a href="javascript:void(0)" class="db-app-slot db-app-slot--empty" onclick="${goToConnector}">
                        <div class="db-app-slot-empty-content">
                            <div class="db-app-slot-plus-circle">+</div>
                            <span class="db-app-slot-label">Try any App (24h)</span>
                        </div>
                    </a>
                `;
            }
        }
    }

    (async function initLauncher() {
        try {
            const { ok, data } = await window.MoshlyAuth.authFetch('/me');
            if (ok && data.user) {
                const user = data.user;
                if (user.profile?.uxSettings?.emptySlots) {
                    localStorage.setItem('moshly_setting_empty_slots', user.profile.uxSettings.emptySlots);
                }
                updateLauncherAppsUI(user);
                return;
            }
        } catch (e) {
            console.warn('Launcher: /me fetch failed, falling back to localStorage', e);
        }
        // Fallback to cached user if /me fails
        const userStr = localStorage.getItem('moshly_user');
        const user = (() => { try { return JSON.parse(userStr || 'null'); } catch { return null; } })();
        if (user) {
            updateLauncherAppsUI(user);
        }
    })();

    (function syncLauncherName() {
      const params = new URLSearchParams(window.location.search);
      let firstName = (params.get('first') || '').trim();

      if (!firstName) {
        try {
          const cachedUser = JSON.parse(localStorage.getItem('moshly_user') || 'null');
          if (cachedUser && typeof cachedUser.name === 'string') {
            firstName = cachedUser.name.split(' ')[0] || '';
          }
        } catch (_) {
          // Ignore parse errors and keep fallback value.
        }
      }

      const safeName = firstName || 'UserName';
      document.querySelectorAll('[data-first-name]').forEach((el) => {
        el.textContent = safeName;
      });
    })();

    (async function syncLauncherPendingAlert() {
      const el = document.getElementById('launcherPendingAlert');
      const textEl = document.getElementById('launcherPendingAlertText');
      if (!el || !textEl) return;
      const formatPendingIn = (effectiveAt) => {
        const diff = new Date(effectiveAt) - Date.now();
        if (diff <= 0) return null;
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const parts = [];
        if (d) parts.push(`${d}d`);
        if (h) parts.push(`${h}h`);
        parts.push(`${m}m`);
        return parts.join(' ');
      };
      try {
        const isLocalDevHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const useDevMock = isLocalDevHost && new URLSearchParams(location.search).get('dev_mock') !== '0';
        let pending = null;
        if (useDevMock) {
          const user = JSON.parse(localStorage.getItem('moshly_user') || 'null');
          pending = user?.pending_change ?? null;
        } else {
          const res = await window.MoshlyAuth.authFetch('/apps/state');
          if (res.ok && res.data) pending = res.data.pending_change ?? null;
        }
        if (!pending?.effective_at) return;
        const label = formatPendingIn(pending.effective_at);
        if (!label) return;
        textEl.textContent = `App change effective in ${label}`;
        el.hidden = false;
        setInterval(() => {
          const l = formatPendingIn(pending.effective_at);
          if (!l) { el.hidden = true; return; }
          textEl.textContent = `App change effective in ${l}`;
        }, 30000);
      } catch (_) { /* silent */ }
    })();

    (function syncLauncherClock() {
      const el = document.getElementById('launcher-live-datetime');
      if (!el) return;

      const locale = navigator.language || 'pt-PT';
      const formatNow = () => {
        const now = new Date();
        const dateText = now.toLocaleDateString(locale, {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
        const timeText = now.toLocaleTimeString(locale, {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        return { dateText, timeText };
      };

      const paint = () => {
        const { dateText, timeText } = formatNow();
        el.innerHTML = '<span>' + dateText + '</span><span class="launcher-time">' + timeText + '</span>';
      };

      paint();
      setInterval(() => {
        paint();
      }, 1000);
    })();
    })();
  </script>
