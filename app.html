<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Moshly" />
  <title>Moshly</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <!--
    Browshly — the Moshly app frame.
    Shows one Moshly app (its own subdomain) in a full-screen iframe so the installed
    PWA never leaves moshly.io and iOS never shows its in-app browser (X + bars).
    Each app keeps its own origin: storage, cookies and scripts stay isolated.
    The app talks to this page only through postMessage ({ type: 'moshly:home' }).
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #070a14; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      color: #fff;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #070a14;
    }
    #status {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font-size: 14px; letter-spacing: 0.04em; color: rgba(255,255,255,0.7);
      text-align: center; padding: 24px;
    }
    #status[hidden] { display: none; }
    #status a { color: #fff; font-weight: 700; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Opening…</div>
  <iframe id="frame" title="Moshly app" allow="clipboard-read; clipboard-write; fullscreen" hidden></iframe>

  <script src="/auth-client.js"></script>
  <script src="/moshly-apps.js"></script>
  <script>
    (function () {
      'use strict';

      const statusEl = document.getElementById('status');
      const frame = document.getElementById('frame');
      const HOME = '/launcher';

      function fail(msg) {
        frame.hidden = true;
        statusEl.hidden = false;
        statusEl.textContent = '';
        const p = document.createElement('p');
        p.textContent = msg;
        const a = document.createElement('a');
        a.href = HOME;
        a.textContent = 'Back to Moshly';
        statusEl.append(p, a);
      }

      // Only apps flagged `shell: true` on a moshly.io subdomain can be framed.
      const slug = new URLSearchParams(location.search).get('app') || '';
      const app = window.MoshlyApps.CATALOG.find((a) => a.slug === slug);
      const appOrigin = app && window.MoshlyApps.shellOrigin?.(app);
      if (!appOrigin) { fail('This app cannot be opened here.'); return; }

      document.title = `${app.name} · Moshly`;

      // The framed app asks to go home; accept it only from that app's own origin.
      window.addEventListener('message', (event) => {
        if (event.origin !== appOrigin || event.source !== frame.contentWindow) return;
        if (event.data && event.data.type === 'moshly:home') location.href = HOME;
      });

      (async function open() {
        const ok = await window.MoshlyAuth.requireSession('/login');
        if (!ok) return;
        try {
          const res = await window.MoshlyAuth.authFetch('/auth/sso/token', { method: 'POST' });
          if (!res.ok || !res.data?.token) throw new Error(`server responded ${res.status}`);
          frame.src = `${appOrigin}/auth/callback?token=${encodeURIComponent(res.data.token)}`;
          frame.hidden = false;
          frame.addEventListener('load', () => { statusEl.hidden = true; }, { once: true });
        } catch (err) {
          console.error('[Browshly] SSO launch failed:', err);
          fail('Could not connect. Please try again.');
        }
      })();
    })();
  </script>
</body>
</html>
