<!DOCTYPE html>
<html lang="en" class="skin-brutal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entering Quote — Moshly</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <meta name="theme-color" content="#181818" />
  <script>
    try { if (localStorage.getItem('moshly-theme') === 'light') document.documentElement.classList.add('theme-light'); } catch (_) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tokens/neo-brut.css" />
  <link rel="stylesheet" href="/apps/handoff.css" />
  <script src="/auth-client.js"></script>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="trip" aria-hidden="true">
      <img src="/assets/neo-brut-icons/moshly.png" alt="" width="64" height="64" />
      <span class="road"></span>
      <img src="/assets/neo-brut-icons/quote.png" alt="" width="64" height="64" />
    </div>
    <div class="brand">Moshly Hub → Quote</div>
    <h1>Welcome to Quote…</h1>
    <p>Validating your secure session with the Hub and preparing Quote.</p>
    <div class="status" id="status"><span class="dot"></span>Validating SSO token…</div>
    <div id="error" class="error" style="display:none;"></div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');

    const QUOTE_BASE_URL = 'https://quote.moshly.io';

    (async function quoteCallback() {
      try {
        // Step 1: Extract SSO token from URL
        const params = new URLSearchParams(window.location.search);
        let ssoToken = params.get('token');

        if (!ssoToken) {
          // Direct access without SSO token — check existing Hub session
          statusEl.innerHTML = '<span class="dot"></span>Checking Moshly session…';

          const user = await window.MoshlyAuth.getSessionRobust();
          if (!user) {
            showError('No active session. Redirecting to Moshly…');
            setTimeout(() => {
              window.location.href = '/login?redirect=' + encodeURIComponent(window.location.href);
            }, 1200);
            return;
          }

          // Has Hub session but no SSO token — generate one now!
          statusEl.innerHTML = '<span class="dot"></span>Preparing Quote session…';
          const { ok, data } = await window.MoshlyAuth.authFetch('/auth/sso/token', { method: 'POST' });
          
          if (!ok) {
            showError('Failed to generate SSO token. <br />Please return to <a href="/">the Hub</a> and try again.');
            return;
          }

          // We got a token! Continue to redirect
          ssoToken = data.token;
        }

        // Step 2: Show handoff UI, then redirect to Quote with the token intact
        // The token must NOT be consumed here — Quote's own server validates it.
        statusEl.innerHTML = '<span class="dot"></span>Establishing secure session…';

        setTimeout(() => {
          statusEl.innerHTML = '✓ Secure session established';
          document.querySelector('h1').textContent = 'Quote Ready';
          document.querySelector('p').textContent = 'Your session has been validated with the Moshly Hub.';

          // Redirect to Quote callback with the SSO token
          const destination = QUOTE_BASE_URL + '/quote.html?token=' + encodeURIComponent(ssoToken);
          window.location.replace(destination);
        }, 300);

      } catch (err) {
        console.error('Quote callback error:', err);
        showError(
          'Session handoff failed: ' + err.message +
          '<br />Please return to <a href="/">the Hub</a> and try again.'
        );
      }
    })();

    function showError(message) {
      statusEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.innerHTML = message;
    }
  </script>
</body>
</html>
