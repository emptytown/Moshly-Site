name = "moshly-days-push"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Every minute: push the Days alerts (task due reminders, checklist reminders) that are due.
[triggers]
crons = ["* * * * *"]

# Same D1 database as the Hub: reads days_sync, push_subscriptions, push_sent.
[[d1_databases]]
binding = "MOSHLY_DB"
database_name = "moshly-db"
database_id = "078bb103-ae9b-4975-9e21-66877f480333"

[vars]
PUSH_CONTACT = "mailto:hello@moshly.io"

# Secret (wrangler secret put VAPID_PRIVATE_JWK): the VAPID private key as a JWK JSON string.
