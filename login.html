<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Log In — Moshly</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="assets/Moshly-Main-Logo-1.svg" alt="Moshly" class="nav-logo-img" />
        <span class="nav-logo-text">Moshly</span>
      </a>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-modal">

      <div class="auth-logo">
        <img src="assets/Moshly-Main-Logo-1.svg" alt="Moshly" class="auth-logo-img" />
      </div>

      <h2 class="auth-panel-title" style="margin-bottom:6px;">Welcome back</h2>
      <p class="auth-panel-desc" style="margin-bottom:24px;">Log in to your Moshly account.</p>

      <form class="auth-form" id="loginForm" autocomplete="on" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label class="auth-label" for="login-email">Email</label>
          <input class="auth-input" type="email" id="login-email" placeholder="your@email.com" required autocomplete="username" />
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="auth-label" for="login-password">Password</label>
            <a href="/forgot-password" class="auth-forgot">Forgot password?</a>
          </div>
          <div class="auth-pw-wrap">
            <input class="auth-input" type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="auth-pw-toggle" aria-label="Show password" onclick="togglePwVisibility(this)">
              <svg class="pw-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div id="login-feedback" class="auth-feedback auth-feedback--error" style="display:none;"></div>

        <button type="submit" class="btn-primary auth-submit" id="loginBtn">Log In</button>
      </form>

      <p class="auth-switch" style="margin-top:20px;">Don't have an account? <a href="/signup">Sign Up</a></p>
      <p class="auth-switch" style="margin-top:8px;">Have an invite code? <a href="/join">Join a workspace</a></p>

    </div>
  </section>

  <script src="/moshly-ui.js"></script>
  <script src="/auth-client.js"></script>
  <script>
    // Redirect already-authenticated users
    (async () => {
      // Pass true to getSession to skip silent refresh on initial page load.
      // This prevents accidental session leakage (F-01) if another user was
      // previously logged in on the same browser but didn't log out.
      const user = await MoshlyAuth.getSession(true);
      if (user) {
        const params = new URLSearchParams(window.location.search);
        const redirectParam = params.get('redirect');
        window.location.href = (redirectParam && redirectParam.startsWith('/') && !redirectParam.startsWith('//')) ? redirectParam : '/dashboard';
      }
    })();

    // Show confirmation message if redirected after signup
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const reason = params.get("reason");
      const fb = document.getElementById("login-feedback");
      if (reason === "expired") {
        fb.textContent = "Your session has expired. Please log in again to continue.";
        fb.className = "auth-feedback auth-feedback--error";
        fb.style.display = "block";
      } else if (reason === "unverified") {
        fb.textContent = "Your account is not confirmed yet. Please check your inbox and complete the verification.";
        fb.className = "auth-feedback auth-feedback--error";
        fb.style.display = "block";
      }
      if (params.get('registered') === 'true') {
        const fb = document.getElementById('login-feedback');
        fb.textContent = 'Account created! Please check your email to confirm your account.';
        fb.className = 'auth-feedback auth-feedback--success';
        fb.style.display = 'block';
      }
      // Pre-fill email if passed via query param
      const email = params.get('email');
      if (email) document.getElementById('login-email').value = decodeURIComponent(email);
    });

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
    }

    async function handleLogin(event) {
      event.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const feedback = document.getElementById('login-feedback');
      const btn      = document.getElementById('loginBtn');

      if (btn.disabled) return;

      if (!isValidEmail(email)) {
        feedback.textContent = 'Please enter a valid email address.';
        feedback.className = 'auth-feedback auth-feedback--error';
        feedback.style.display = 'block';
        return;
      }

      feedback.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        const { ok, data, status } = await MoshlyAuth.authFetch('/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (ok && data.success) {
          MoshlyAuth.setSession(data.user, data.token);

          const params = new URLSearchParams(window.location.search);
          const redirectParam = params.get('redirect');
          const dest = (redirectParam && redirectParam.startsWith('/') && !redirectParam.startsWith('//')) ? redirectParam : '/dashboard';
          window.location.href = dest;
          return;
        }

        if (status === 403 || status === 401) {
          feedback.textContent = data.message || 'Authentication failed. Please check your details.';
        } else if (status === 429) {
          feedback.textContent = 'Too many attempts. Please try again later.';
        } else {
          feedback.textContent = data.message || data.error || 'Login failed. Please try again.';
        }
        feedback.className = 'auth-feedback auth-feedback--error';
        feedback.style.display = 'block';
      } catch {
        feedback.textContent = 'An error occurred. Please try again.';
        feedback.className = 'auth-feedback auth-feedback--error';
        feedback.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    }

  </script>
</body>
</html>
